name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.6'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Haxelib dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install android6permissions --quiet
          haxelib install hxcpp --quiet

      - name: Configure Lime Android Tools
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/25.2.9519653"

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Verify Android Toolchain
        run: |
          echo "Java:"
          java -version

          echo "Haxe:"
          haxe --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo "NDK version:"
          cat "$ANDROID_NDK_ROOT/source.properties"

      - name: Build Android APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/25.2.9519653"

          haxelib run lime build android -release -Dandroid64 -verbose

      - name: Find APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            export/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
