name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11' # Use '11' for older Gradle/NDK setups, or '17' for modern Gradle builds

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.6'

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install hxcpp --quiet
          haxelib install android6permissions --quiet

      - name: Configure Lime Android Tools
        run: |
          # Automatically find any valid pre-installed NDK version on the GitHub runner if LATEST is too new
          # If your project strictly needs a specific legacy NDK, you can replace $ANDROID_NDK_LATEST_HOME with "$ANDROID_HOME/ndk-bundle"
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compile APK
        run: |
          haxelib run lime build android -release -Dandroid64 -verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            export/android/bin/app/build/outputs/apk/release/*.apk
            export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
