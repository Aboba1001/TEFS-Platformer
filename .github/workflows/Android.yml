name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: "21.4.7075529"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.6"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-30"
          sdkmanager "build-tools;30.0.3"
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Haxelib dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install android6permissions --quiet
          haxelib install hxcpp --quiet

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Generate Android project
        run: |
          haxelib run lime update android

      - name: Fix android6permissions Gradle dependency
        run: |
          find export/android/bin/deps -name build.gradle -type f -exec sed -i 's/compile project/implementation project/g' {} +

      - name: Build Android APK
        run: |
          cd export/android
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            export/**/*.apk
          if-no-files-found: error
