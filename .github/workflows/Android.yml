name: Android Build (Modern)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.6' # Upgraded Haxe to stable 4.3

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          # Pulls the absolute newest stable versions of the toolchain
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install hxcpp --quiet
          haxelib install android6permissions --quiet

      - name: Setup Lime and Android
        run: |
          haxelib run lime setup
          echo -e "\n\n" | haxelib run lime setup android

      - name: Compile
        run: |
          haxelib run lime build android -release
