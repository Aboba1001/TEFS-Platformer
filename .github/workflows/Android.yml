name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: /home/runner/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('haxelib.json', 'Project.xml') }}
          restore-keys: |
            haxelib-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;21.4.7075529"

      - name: Install Haxelib
        run: |
          haxelib setup /home/runner/haxelib
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install hxcpp 4.2.1 --quiet
          haxelib install android6permissions 0.2.1 --quiet
          haxelib set flixel 4.11.0
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0

      - name: Configure Lime Android Environment
        run: |
          mkdir -p ~/.lime
          cat << 'EOF' > ~/.lime/config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <config>
            <section id="android">
              <path id="ANDROID_SDK" value="${ANDROID_HOME}" />
              <path id="ANDROID_NDK_ROOT" value="${ANDROID_HOME}/ndk/21.4.7075529" />
              <path id="JAVA_HOME" value="${JAVA_HOME}" />
            </section>
            <define name="android" />
          </config>
          EOF

      - name: Compile
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: haxelib run lime build android -final -Dno-pch

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk