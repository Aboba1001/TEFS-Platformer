name: Android Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.2.5'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and configure symlink for Lime
        run: |
          # Install NDK r21e which is fully compatible with older Hxcpp/Lime setups
          sdkmanager "ndk;21.4.7075529"
          
          # Create a symlink from the side-by-side NDK folder to ndk-bundle where Lime expects it
          ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$HOME/android-sdk}
          ln -s $ANDROID_SDK_ROOT/ndk/21.4.7075529 $ANDROID_SDK_ROOT/ndk-bundle
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk-bundle" >> $GITHUB_ENV

      - name: Build App
        run: |
          haxelib setup ~/haxelib
          haxelib install haxelib.json --always
          echo "$HOME/.haxelib/bin" >> $GITHUB_PATH
          lime build android -release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: export/**/build/outputs/apk/release/*.apk