name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  buildAndroid:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: C:\haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('haxelib.json', 'Project.xml') }}
          restore-keys: |
            haxelib-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;21.4.7075529"
        shell: cmd

      - name: Install Haxelib
        run: |
          haxelib setup C:\haxelib
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install hxcpp 4.2.1 --quiet
          haxelib install android6permissions 0.2.1 --quiet
          haxelib set flixel 4.11.0
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
        shell: cmd
        
      - name: Configure Lime Android Settings
        run: |
          haxelib run lime setup -alias
          lime config ANDROID_SDK $ANDROID_HOME
          lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          lime config JAVA_HOME $JAVA_HOME
          lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build android -final -Dno-pch
        shell: cmd

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk